name: "reversing c_str"
limit: 1000
memory_size: 0x1000
memory_mapped_io:
  0x80: [65, 66, 67, 10]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      {pc}:	{instruction}	{pc:label}
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
      numio[0x80]: {io:0x80:sym}
      numio[0x84]: {io:0x84:sym}
  #   assert: |
  #     numio[0x80]: [65,66,67,68] >>> []
  #     numio[0x84]: [] >>> [68,67,66,65]
  #     numio[0x80]: "ABCD" >>> ""
  #     numio[0x84]: "" >>> "DCBA"
      
