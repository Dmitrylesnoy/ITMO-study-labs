limit: 5000
memory_size: 0x1000
memory_mapped_io:
  0x80: [49, 32, 49, 32, 43, 10]
  0x84: []
reports:
  - name: step-by-step
    slice: all
    view: |
      {pc}:	{D0} {D1} {D2} {D3} {D4} {A2} {A3} {instruction}	{pc:label}
  - name: result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [2]
